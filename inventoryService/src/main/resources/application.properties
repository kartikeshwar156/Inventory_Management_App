spring.application.name=inventoryService

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# to configure the docker mysql in our springboot project
# below we are making a connection to database with name -> order_Service_DB
spring.datasource.url=jdbc:mysql://localhost:3306/inventory_Service_DB
spring.datasource.username=root
spring.datasource.password=mysql
server.port=8082

# we are doing this for hibernate because we want to transfer data through flyway,
# we have added flyway's dependency
spring.jpa.hibernate.ddl-auto=none

# for spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Spring Boot auto-detects the driver based on spring.datasource.url, but if detection fails, this property ensures the correct driver is loaded.
# this is used If Spring Boot is not automatically picking up the driver.
# Yes, spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver is usually optional in Spring Boot
