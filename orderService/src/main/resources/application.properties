spring.application.name=orderService

# to configure the docker mysql in our springboot project
# below we are making a connection to database with name -> order_Service_DB
spring.datasource.url=jdbc:mysql://localhost:3306/order_Service_DB
spring.datasource.username=root
spring.datasource.password=mysql
server.port=8081

# we are doing this for hibernate because we want to transfer data through flyway,
# we have added flyway's dependency
spring.jpa.hibernate.ddl-auto=none

springdoc.swagger-ui.path=/swagger-ui.html

#below line is for spring mvc support, i.e. you can get docs through an API
# for accessing below url, use -> http://localhost:8080/api-docs
springdoc.api-docs.path=/api-docs

